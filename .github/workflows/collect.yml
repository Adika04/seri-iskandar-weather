name: Collect weather data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:          # lets you start a run by hand from the Actions tab

# Never run two collections at the same time.
concurrency:
  group: weather-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect once
        run: python main.py --once
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          REQUIRE_TURSO: "1"   # fail loudly if the secrets are missing
